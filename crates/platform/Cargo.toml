[package]
name = "pdfcraft-platform"
description = "Operating-system services shared by the PdfCraft desktop app and automation tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
log = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Atomic saves use explicit xattr size queries and fall back to plain fsync if F_FULLFSYNC is refused.
rustix = { version = "1.1.6", features = ["fs"] }
getrandom = "0.4"
security-framework = "3.7"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
url = "2.5"
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the dependency graph through the accessibility integration. The portal watcher
# uses the async API so dropping it can cancel an idle subscription without polling.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"

[dev-dependencies]
# Exercise the actual portal wire decoder and cancellable worker on every native test host.
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-channel = "2"
futures-lite = "2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3.27"
